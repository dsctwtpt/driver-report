<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#14213d">
<title>配送回報</title>
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --ink:#111827; --sub:#5b6474; --line:#dde2ea;
  --navy:#14213d; --gate:#1d4ed8; --dock:#c2410c; --done:#15803d; --warn:#b45309; --bad:#b91c1c;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:17px;line-height:1.45}
body{min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0}
.hidden{display:none!important}

header{background:var(--navy);color:#fff;padding:12px 16px calc(12px);position:sticky;top:0;z-index:5}
header .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
header .who{font-weight:700;font-size:17px}
header .plate{font-size:14px;opacity:.8}
.status{display:flex;gap:10px;font-size:13px;margin-top:6px;opacity:.95;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border-radius:99px;padding:2px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.ok{background:#4ade80}.dot.mid{background:#facc15}.dot.bad{background:#f87171}
.demo{background:#facc15;color:#111;text-align:center;font-size:13px;font-weight:700;padding:4px}

main{padding:16px;max-width:520px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:19px;margin:0 0 10px}
.muted{color:var(--sub);font-size:15px}
.small{font-size:13px}

.big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:110px;border-radius:20px;color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .05s}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.big small{font-size:15px;font-weight:500;letter-spacing:0;opacity:.9;margin-top:4px}
.big.gate{background:var(--gate)}.big.dock{background:var(--dock)}.big.done{background:var(--done)}.big.navy{background:var(--navy)}
.big[disabled]{background:#9ca3af;box-shadow:none}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:18px;font-weight:700;background:#e5e9f0;color:var(--ink)}
.btn.primary{background:var(--navy);color:#fff}
.btn.ghost{background:transparent;color:var(--sub);font-weight:500;font-size:15px;padding:10px}
.btn+.btn{margin-top:10px}
.links{display:flex;justify-content:space-between;margin-top:12px}
.links button{background:none;color:var(--sub);font-size:15px;padding:8px 4px;text-decoration:underline}
.links button.alert{color:var(--bad)}

label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;font:inherit;font-size:18px;padding:13px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#eef2f7;border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:16px;display:flex;align-items:center;gap:8px}
.chip button{background:#d6dce6;border-radius:50%;width:26px;height:26px;font-size:15px;line-height:26px;padding:0;color:#333}
.choice{display:grid;gap:10px}
.choice button{padding:16px;border-radius:14px;background:#eef2f7;font-size:18px;font-weight:700;text-align:left;display:flex;justify-content:space-between;align-items:center}
.choice button.sel{background:var(--navy);color:#fff}
.choice button span{font-weight:400;font-size:14px;color:var(--sub)}
.choice button.sel span{color:#cbd5e1}

#reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:220px;position:relative}
#reader video{width:100%!important;display:block}
.scan-hint{position:absolute;inset:auto 0 10px 0;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 2px #000}
.flash{animation:flash .4s}
@keyframes flash{0%{background:#bbf7d0}100%{background:#eef2f7}}

.detect{border:3px solid var(--gate);background:#eff4ff}
.detect .site{font-size:24px;font-weight:800;margin:4px 0 12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#e0e7ff;color:#3730a3;vertical-align:middle}
.tag.fab{background:#fde68a;color:#78350f}

.steps{display:flex;gap:6px;margin:12px 0 16px}
.step{flex:1;text-align:center;padding:8px 2px;border-radius:10px;background:#eef2f7;color:var(--sub);font-size:14px}
.step b{display:block;font-size:15px;color:var(--ink)}
.step.ok{background:#dcfce7;color:#166534}.step.ok b{color:#166534}
.step.now{outline:2.5px solid var(--navy);background:#fff}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:16px;z-index:30;max-width:90vw;text-align:center}
.center{text-align:center}
.okmark{font-size:64px;line-height:1}
.consent{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--sub)}
</style>
</head>
<body>
<div id="demoBar" class="demo hidden">示範模式：資料不會送出，可自由試按</div>
<header id="hdr" class="hidden">
  <div class="row">
    <div><div class="who" id="hdrName"></div><div class="plate" id="hdrPlate"></div></div>
    <div class="small" id="hdrTrip"></div>
  </div>
  <div class="status">
    <span class="pill"><span class="dot" id="gpsDot"></span><span id="gpsTxt">定位中</span></span>
    <span class="pill"><span class="dot" id="syncDot"></span><span id="syncTxt">已同步</span></span>
  </div>
</header>
<main id="app"><div class="card center muted">載入中…</div></main>
<div id="sheetRoot"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
// 每次開啟都抓最新的設定與程式，避免 LINE 快取舊版
(function(){var v=Date.now();function L(src,cb){var s=document.createElement('script');s.src=src+'?v='+v;s.onload=cb||null;s.onerror=function(){document.getElementById('app').innerHTML='<div class="card center"><h1>載入失敗</h1><p class="muted">請檢查網路後重新開啟</p></div>';};document.body.appendChild(s);}
L('config.js',function(){L('app.js');});})();
</script>
</body>
</html>
